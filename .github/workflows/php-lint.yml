name: PHP migration syntax check
on:
  push:
    paths:
      - 'php/**'
      - 'Index.html'
      - 'Scripts.html'
      - 'Styles.html'
      - 'Logo.html'
      - 'index.php'
      - 'api.php'
      - 'probe.php'
      - 'setup.php'
      - '.htaccess'
      - '.github/workflows/php-lint.yml'
  pull_request:
    paths:
      - 'php/**'
      - 'index.php'
      - 'api.php'
      - 'setup.php'
      - '.htaccess'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        run: php -v
      - name: Syntax-check PHP source
        run: |
          set -eu
          find php -name '*.php' -type f ! -name 'config.local.php' -print0 | xargs -0 -n1 php -l
          php -l index.php
          php -l api.php
          php -l probe.php
          php -l setup.php
          php php/tests/mysql-time-test.php
          node --check < Scripts.html
          node --check < apps-script/97_WorkspaceBridge.gs
          php -l php/workspace_bridge.php
          php -l php/workspace_services.php
          php index.php > /tmp/eke-css-check.html
          python3 - <<'PY'
          from pathlib import Path
          html=Path('/tmp/eke-css-check.html').read_text()
          style=html.split('</style>',1)
          assert len(style)==2
          assert not style[1].lstrip().startswith('.review-role-tag'), 'CSS leaked into body'
          assert '<style>' in style[0]
          print('CSS stylesheet integration PASS')
          PY
      - name: Verify PHP frontend renders and replaces Apps Script RPC
        run: |
          set -eu
          php index.php > /tmp/ekeberadaan-rendered.html
          grep -Fq 'fetch("api.php"' /tmp/ekeberadaan-rendered.html
          if grep -q 'google.script.run' /tmp/ekeberadaan-rendered.html; then
            echo 'Apps Script RPC remains in rendered PHP page'
            exit 1
          fi
          grep -q 'e-Keberadaan' /tmp/ekeberadaan-rendered.html


      - name: Test legacy Google Sheets PIN login compatibility
        run: php php/tests/legacy-pin-test.php
      - name: HTTP API health smoke test (no DB credentials required)
        shell: bash
        run: |
          set -eu
          php -S 127.0.0.1:18765 -t . > /tmp/eke-php-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 25); do
            if curl -sS -m 3 -o /tmp/eke-api-health.json \
              -H 'Content-Type: application/json' \
              -d '{"fn":"getApiStatus","args":[]}' \
              http://127.0.0.1:18765/api.php; then
              ready=1
              break
            fi
            sleep 0.3
          done
          if [ "$ready" != 1 ]; then cat /tmp/eke-php-server.log; exit 1; fi
          php -r '$x=json_decode(file_get_contents("/tmp/eke-api-health.json"),true); if(!is_array($x) || !($x["ok"]??false) || !($x["result"]["healthy"]??false)) {fwrite(STDERR,"API health failed without MySQL configuration\n");exit(1);} echo "API health PASS\n";'
          code=$(curl -sS -o /tmp/eke-root-health.json -w '%{http_code}' 'http://127.0.0.1:18765/api.php?health=1')
          test "$code" = "200"
          php -r '$x=json_decode(file_get_contents("/tmp/eke-root-health.json"),true); if(!($x["ok"]??false)||($x["stage"]??"")!=="root-gateway")exit(1); echo "Root API diagnostic PASS\n";'
          code=$(curl -sS -o /tmp/eke-probe.json -w '%{http_code}' 'http://127.0.0.1:18765/probe.php')
          test "$code" = "200"
          php -r '$x=json_decode(file_get_contents("/tmp/eke-probe.json"),true); if(!($x["ok"]??false)||($x["stage"]??"")!=="standalone-php")exit(1); echo "Standalone hosting diagnostic PASS\n";'
      - name: Workspace export returns actionable JSON if cPanel modules are missing
        shell: bash
        run: |
          set -euo pipefail
          testdir="$(mktemp -d)"
          cp php/api.php php/_lib.php "$testdir/"
          php -S 127.0.0.1:18768 -t "$testdir" >/tmp/eke-missing-workspace.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -rf "$testdir"' EXIT
          status=''
          for attempt in $(seq 1 20); do
            status=$(curl -sS -m 3 -o /tmp/eke-missing-workspace.json -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -d '{"fn":"generateAttendancePresenceReportPdf","args":["dummy-session",{"fromDate":"2026-10-01","toDate":"2026-10-31"}]}' \
              http://127.0.0.1:18768/api.php || true)
            test "$status" != "000" && break
            sleep 0.2
          done
          test "$status" = "422"
          php -r '$j=json_decode(file_get_contents("/tmp/eke-missing-workspace.json"),true); if(!is_array($j)||($j["ok"]??true)!==false||!str_contains($j["error"]??"","workspace_services.php"))exit(1); echo "Missing Workspace files: actionable JSON PASS\n";'
          status=$(curl -sS -o /tmp/eke-missing-health.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -d '{"fn":"getApiStatus","args":[]}' \
            http://127.0.0.1:18768/api.php)
          test "$status" = "200"
          php -r '$j=json_decode(file_get_contents("/tmp/eke-missing-health.json"),true); if(!($j["result"]["healthy"]??false))exit(1); echo "Core API stays healthy PASS\n";'
      - name: Verify browser setup page and PIN UI syntax
        run: |
          set -eu
          node --check php/pin-ui.js
          php -l php/setup.php
          grep -q "openChangePin" /tmp/ekeberadaan-rendered.html
          grep -q "ekeberadaansmkbbsul/api.php" php/README.md
