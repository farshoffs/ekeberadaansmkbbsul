name: Materialize performance backend

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - 'Code.gs'
      - 'Bridges.gs'
      - 'Bridge.html'
      - 'appsscript.json'
      - 'scripts/materialize-backend.py'
      - '.github/workflows/materialize-performance-backend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/performance-v2
      - name: Generate modular backend
        run: python3 scripts/materialize-backend.py
      - name: Validate backend syntax
        run: |
          cat apps-script/*.gs > /tmp/apps-script.js
          node --check /tmp/apps-script.js
      - name: Commit generated modules
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script
          if git diff --cached --quiet; then
            echo "No generated backend changes."
            exit 0
          fi
          git commit -m "refactor: materialize modular Apps Script backend"
          git push origin HEAD:refactor/performance-v2
