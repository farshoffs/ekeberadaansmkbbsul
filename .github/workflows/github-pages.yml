name: Publish optimized eKeberadaan web

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - 'Index.html'
      - 'Scripts.html'
      - 'Styles.html'
      - 'Logo.html'
      - 'package.json'
      - 'web/**'
      - 'scripts/build-pages.py'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build optimized static site
        run: python3 scripts/build-pages.py

      - name: Validate output
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/sw.js
          test -f _site/manifest.webmanifest
          test -f _site/vendor/bootstrap/bootstrap.min.css
          test -f _site/vendor/bootstrap/bootstrap.bundle.min.js
          ! grep -q 'data:image' _site/index.html
          ! grep -q 'cdn.jsdelivr.net' _site/index.html
          grep -q 'vendor/bootstrap/bootstrap.min.css' _site/index.html
          grep -q 'vendor/bootstrap/bootstrap.bundle.min.js' _site/index.html
          grep -R -q 'spinner-border spinner-border-sm' _site/assets
          html=$(wc -c < _site/index.html)
          total=$(du -sb _site | awk '{print $1}')
          echo "HTML=$html bytes TOTAL=$total bytes"
          test "$html" -lt 100000
          test "$total" -lt 900000

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/eke-gh-pages
          cp -a _site /tmp/eke-gh-pages
          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout --orphan gh-pages
          git rm -rf .
          cp -a /tmp/eke-gh-pages/. .
          git add -A
          git commit -m "deploy: optimized static web ${GITHUB_SHA}"
          git push --force origin HEAD:gh-pages
