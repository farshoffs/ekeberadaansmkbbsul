name: Deploy modular Apps Script

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate backend syntax
        run: |
          cat apps-script/*.gs > /tmp/apps-script.js
          node --check /tmp/apps-script.js
          grep -R -q 'function doPost(e)' apps-script
          grep -R -q 'function getAttendanceRowIndex_' apps-script

      - name: Check deployment secrets
        shell: bash
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "$APPS_SCRIPT_ID" || { echo 'Missing APPS_SCRIPT_ID'; exit 1; }
          test -n "$CLASPRC_JSON" || { echo 'Missing CLASPRC_JSON'; exit 1; }

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure clasp
        shell: bash
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"apps-script"}\n' "$APPS_SCRIPT_ID" > .clasp.json

      - name: Push canonical modular source
        run: clasp push --force

      - name: Deployment note
        run: echo 'Modular source pushed. Publish a New version from Apps Script Manage deployments for the existing /exec URL.'
