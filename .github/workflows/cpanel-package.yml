name: Build cPanel upload package
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Index.html'
      - 'Logo.html'
      - 'Scripts.html'
      - 'Styles.html'
      - 'index.php'
      - 'api.php'
      - 'probe.php'
      - '.htaccess'
      - 'php/**'
      - '.github/workflows/cpanel-package.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate core PHP files and latest frontend
        run: |
          set -eu
          php -l index.php
          php -l api.php
          php -l probe.php
          php -l php/_lib.php
          php -l php/api.php
          php -l php/index.php
          php php/tests/mysql-time-test.php
          node --check < Scripts.html
          node --check < apps-script/97_WorkspaceBridge.gs
          php -l php/workspace_bridge.php
          php -l php/workspace_services.php
          test "$(grep -ic '</style>' Styles.html)" = "1"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Styles.html').read_text()
          assert s.rstrip().endswith('</style>'), 'Unstyled CSS may leak into body'
          print('Styles.html output PASS')
          PY
          php index.php > /tmp/php-frontend.html
          grep -Fq 'fetch("api.php"' /tmp/php-frontend.html
          if grep -q 'google.script.run' /tmp/php-frontend.html; then
            echo 'Unexpected Google Apps Script RPC in PHP site'
            exit 1
          fi
      - name: HTTP API health smoke test (no DB credentials required)
        shell: bash
        run: |
          set -eu
          php -S 127.0.0.1:18765 -t . > /tmp/eke-php-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 25); do
            if curl -sS -m 3 -o /tmp/eke-api-health.json \
              -H 'Content-Type: application/json' \
              -d '{"fn":"getApiStatus","args":[]}' \
              http://127.0.0.1:18765/api.php; then
              ready=1
              break
            fi
            sleep 0.3
          done
          if [ "$ready" != 1 ]; then cat /tmp/eke-php-server.log; exit 1; fi
          php -r '$x=json_decode(file_get_contents("/tmp/eke-api-health.json"),true); if(!is_array($x) || !($x["ok"]??false) || !($x["result"]["healthy"]??false)) {fwrite(STDERR,"API health failed without MySQL configuration\n");exit(1);} echo "API health PASS\n";'
          code=$(curl -sS -o /tmp/eke-root-health.json -w '%{http_code}' 'http://127.0.0.1:18765/api.php?health=1')
          test "$code" = "200"
          php -r '$x=json_decode(file_get_contents("/tmp/eke-root-health.json"),true); if(!($x["ok"]??false)||($x["stage"]??"")!=="root-gateway")exit(1); echo "Root API diagnostic PASS\n";'
          code=$(curl -sS -o /tmp/eke-probe.json -w '%{http_code}' 'http://127.0.0.1:18765/probe.php')
          test "$code" = "200"
          php -r '$x=json_decode(file_get_contents("/tmp/eke-probe.json"),true); if(!($x["ok"]??false)||($x["stage"]??"")!=="standalone-php")exit(1); echo "Standalone hosting diagnostic PASS\n";'
      - name: Package only PHP hosting runtime — leave database secrets untouched
        shell: bash
        run: |
          set -eu
          mkdir -p /tmp/deploy/php
          cp index.php api.php probe.php Index.html Scripts.html Styles.html Logo.html .htaccess /tmp/deploy/
          cp php/index.php php/api.php php/_lib.php php/workspace_bridge.php php/workspace_services.php php/pin-ui.js php/.htaccess php/config.local.example.php php/schema.sql /tmp/deploy/php/
          test ! -e /tmp/deploy/php/config.local.php
          test ! -e /tmp/deploy/setup.php
          test ! -e /tmp/deploy/php/setup.php
          cd /tmp/deploy
          zip -q -r "$GITHUB_WORKSPACE/ekeberadaansmkbbsul-cpanel.zip" .
          unzip -l "$GITHUB_WORKSPACE/ekeberadaansmkbbsul-cpanel.zip"
      - name: Create minimal API diagnostic hotfix (only 2 files)
        shell: bash
        run: |
          set -eu
          mkdir -p /tmp/hotfix
          cp api.php probe.php /tmp/hotfix/
          cd /tmp/hotfix
          zip -q "$GITHUB_WORKSPACE/ekeberadaansmkbbsul-api-diagnostic.zip" api.php probe.php
      - name: Attach minimal diagnostic ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ekeberadaansmkbbsul-api-diagnostic
          path: ekeberadaansmkbbsul-api-diagnostic.zip
          retention-days: 14
      - name: Attach cPanel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ekeberadaansmkbbsul-cpanel-package
          path: ekeberadaansmkbbsul-cpanel.zip
          retention-days: 14
