name: Mirror repository to secondary GitHub account

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-secondary-repository
  cancel-in-progress: true

jobs:
  mirror:
    # Prevent the copied workflow from running again inside the mirror repo.
    if: github.repository == 'farshoffs/ekeberadaansmkbbsul'
    runs-on: ubuntu-latest

    steps:
      - name: Validate mirror configuration
        shell: bash
        env:
          MIRROR_REPOSITORY: ${{ vars.MIRROR_REPOSITORY }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_REPOSITORY}" ]; then
            echo "Missing repository variable MIRROR_REPOSITORY (example: newusername/ekeberadaansmkbbsul)."
            exit 1
          fi
          if [ -z "${MIRROR_TOKEN}" ]; then
            echo "Missing Actions secret MIRROR_TOKEN."
            exit 1
          fi
          if ! [[ "${MIRROR_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "MIRROR_REPOSITORY must be in owner/repository format."
            exit 1
          fi

      - name: Clone source as mirror
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            source.git

      - name: Push all branches and tags to mirror
        shell: bash
        env:
          MIRROR_REPOSITORY: ${{ vars.MIRROR_REPOSITORY }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          cd source.git
          git remote add mirror \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPOSITORY}.git"

          # Keep the secondary repo aligned with the source repo.
          # This intentionally force-updates and prunes branches/tags in the mirror.
          git push --prune --force mirror \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'

          echo "Mirror sync completed: ${GITHUB_REPOSITORY} -> ${MIRROR_REPOSITORY}"
