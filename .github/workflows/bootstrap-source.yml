name: Bootstrap source baseline

on:
  push:
    paths:
      - '_bootstrap/READY'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message != 'build: materialize source baseline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct source files
        shell: bash
        run: |
          set -euo pipefail
          cat _bootstrap/Code.gs.b64.* | tr -d '\n\r' | base64 -d > Code.gs
          cat _bootstrap/Index.html.b64.* | tr -d '\n\r' | base64 -d > Index.html
          cat _bootstrap/Scripts.html.b64.* | tr -d '\n\r' | base64 -d > Scripts.html
          cat _bootstrap/Styles.html.b64.* | tr -d '\n\r' | base64 -d > Styles.html

          echo 'c6ee23559e4be5e82193380ed3e39ea38b9d9320cf7eb4589e0a599370dcddf2  Code.gs' | sha256sum -c -
          echo '7455fcaa980183b5d8a0b277350564473b52a9ad33a8e82f0c80116bdd14f628  Index.html' | sha256sum -c -
          echo '067c43e134a562fc42b35f2c52d36713a9307f2ac3bb6eaafaf5500b09fabf7b  Scripts.html' | sha256sum -c -
          echo '3345f8c5bdac8486bdda9b04f8e3b6010a9433c064b6d3c4fb7a54f221e2d791  Styles.html' | sha256sum -c -

          rm -rf _bootstrap
      - name: Commit baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Code.gs Index.html Scripts.html Styles.html _bootstrap
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build: materialize source baseline'
          git push
