name: Deploy eKeberadaan UI to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'Index.html'
      - 'Logo.html'
      - 'Scripts.html'
      - 'Styles.html'
      - 'php/index.php'
      - 'php/pin-ui.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render static UI with the remote cPanel API
        env:
          EKE_PUBLIC_API_URL: https://ppdkmy.edu.my/ekeberadaansmkbbsul/api.php
        run: |
          set -euo pipefail
          mkdir -p _site
          php -l php/index.php
          node --check < Scripts.html
          php index.php > _site/index.html
          python3 - <<'PY'
          from pathlib import Path
          html=Path('_site/index.html').read_text('utf-8')
          assert html.lstrip().lower().startswith('<!doctype html>'), 'HTML renderer failed'
          assert 'fetch("https://ppdkmy.edu.my/ekeberadaansmkbbsul/api.php"' in html, 'Remote PHP API URL missing'
          assert 'google.script.run' not in html, 'Original Google Sheets RPC leaked into static frontend'
          assert "credentials:'omit'" in html, 'Remote API should never use cookies'
          assert 'config.local.php' not in html, 'Hosting config reference unexpectedly rendered'
          html=html.replace('</head>', '<meta name="robots" content="noindex,nofollow"></head>', 1)
          Path('_site/index.html').write_text(html,'utf-8')
          print('PASS: static GitHub Pages UI, cPanel API, no PHP files or DB credentials')
          PY
          touch _site/.nojekyll
          test "$(find _site -type f | wc -l)" = "2"
          test ! -e _site/api.php
          test ! -e _site/php
      - name: Save preview HTML
        uses: actions/upload-artifact@v4
        with:
          name: ekeberadaansmkbbsul-pages-html
          path: _site/index.html
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy UI
        id: deployment
        uses: actions/deploy-pages@v4
